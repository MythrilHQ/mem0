name: Deploy Mem0 Production

# Builds and deploys the production self-hosted Mem0 server + dashboard stack.
# The self-hosted runner labeled `mem0-prod` is the deployment target.
# Secrets/config are passed through the job environment and interpolated by
# Docker Compose at deploy time; the workflow does not write a secrets file.

on:
  push:
    branches: [production]

concurrency:
  group: deploy-mem0-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy production stack
    runs-on: [self-hosted, mem0-prod]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy compose stack
        working-directory: server
        env:
          # Sensitive production environment secrets.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # Non-sensitive production environment variables.
          MEM0_STACK_NAME: ${{ vars.MEM0_STACK_NAME }}
          MEM0_LLM_PROVIDER: ${{ vars.MEM0_LLM_PROVIDER }}
          MEM0_EMBEDDER_PROVIDER: ${{ vars.MEM0_EMBEDDER_PROVIDER }}
          MEM0_DEFAULT_LLM_MODEL: ${{ vars.MEM0_DEFAULT_LLM_MODEL }}
          MEM0_DEFAULT_EMBEDDER_MODEL: ${{ vars.MEM0_DEFAULT_EMBEDDER_MODEL }}
          MEM0_EMBEDDING_DIMS: ${{ vars.MEM0_EMBEDDING_DIMS }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          AUTH_DISABLED: ${{ vars.AUTH_DISABLED }}
          ENABLE_API_DOCS: ${{ vars.ENABLE_API_DOCS || 'false' }}
          NEXT_PUBLIC_INSTANCE_NAME: ${{ vars.NEXT_PUBLIC_INSTANCE_NAME }}
          # Public hostnames (bare domains) — single source of truth.
          MEM0_SERVER_HOST: ${{ vars.MEM0_SERVER_HOST }}
          MEM0_DASHBOARD_HOST: ${{ vars.MEM0_DASHBOARD_HOST }}
          # Optional explicit URL overrides (default: https://<host>).
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # Optional Traefik overrides (defaults come from production Compose).
          TRAEFIK_ENTRYPOINT: ${{ vars.TRAEFIK_ENTRYPOINT }}
          TRAEFIK_CERTRESOLVER: ${{ vars.TRAEFIK_CERTRESOLVER }}
          TRAEFIK_MIDDLEWARES: ${{ vars.TRAEFIK_MIDDLEWARES }}
        run: |
          missing=""
          [ -n "$MEM0_STACK_NAME" ]     || missing="$missing MEM0_STACK_NAME(variable)"
          [ -n "$MEM0_SERVER_HOST" ]    || missing="$missing MEM0_SERVER_HOST(variable)"
          [ -n "$MEM0_DASHBOARD_HOST" ] || missing="$missing MEM0_DASHBOARD_HOST(variable)"
          [ -n "$GOOGLE_API_KEY" ]      || missing="$missing GOOGLE_API_KEY(secret)"
          [ -n "$POSTGRES_PASSWORD" ]   || missing="$missing POSTGRES_PASSWORD(secret)"
          [ -n "$JWT_SECRET" ]          || missing="$missing JWT_SECRET(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required production config:${missing}."
            echo "::error::Set these values in the production GitHub Environment."
            echo "::error::Items marked (variable) belong on Variables; (secret) on Secrets."
            exit 1
          fi

          # Resolve the stack name once so image labels and cleanup use the same value.
          export MEM0_STACK_NAME="${MEM0_STACK_NAME:-mem0}"
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://${MEM0_SERVER_HOST}}"
          export DASHBOARD_URL="${DASHBOARD_URL:-https://${MEM0_DASHBOARD_HOST}}"

          # Always rebuild local images from scratch and refresh base images.
          docker compose -f docker-compose.prod.yaml build --no-cache --pull
          docker compose -f docker-compose.prod.yaml up -d --no-build --remove-orphans

          # Wait for the API. /auth/setup-status is the server's lightweight,
          # pre-auth readiness endpoint (the server has no /api/health route).
          healthy=false
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yaml exec -T mem0 \
                 curl -fsS http://127.0.0.1:8000/auth/setup-status >/dev/null 2>&1; then
              healthy=true
              break
            fi
            echo "waiting for production API... ($i/30)"
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Production API did not become healthy in time"
            docker compose -f docker-compose.prod.yaml ps
            docker compose -f docker-compose.prod.yaml logs --tail=80
            exit 1
          fi

          # Without -a, image prune removes only unused dangling images. The
          # build label restricts cleanup to images produced by this stack.
          docker image prune -f \
            --filter "label=ai.mem0.deployment.project=${MEM0_STACK_NAME}"
          echo "Production API healthy"
