name: Deploy Mem0 Server

# Builds and (re)deploys the self-hosted Mem0 server + dashboard stack on the
# self-hosted runner labeled `mem0`. The runner host IS the deployment target:
# it checks out the repo, materializes server/.env from repository secrets, and
# brings the docker compose stack up in place.

on:
  push:
    branches: [development]
    paths:
      - "server/**"
      - "mem0/**"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys against the same host at once; let an in-flight deploy
# finish rather than cancelling it mid-rollout.
concurrency:
  group: deploy-mem0
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy stack
    runs-on: [self-hosted, mem0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize server/.env from secrets
        working-directory: server
        env:
          # Sensitive — Repository secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # Non-sensitive — Repository variables (with sane defaults)
          MEM0_LLM_PROVIDER: ${{ vars.MEM0_LLM_PROVIDER }}
          MEM0_EMBEDDER_PROVIDER: ${{ vars.MEM0_EMBEDDER_PROVIDER }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          AUTH_DISABLED: ${{ vars.AUTH_DISABLED }}
          # Public hostnames (bare domains, no scheme) — the single source of truth.
          MEM0_SERVER_HOST: ${{ vars.MEM0_SERVER_HOST }}
          MEM0_DASHBOARD_HOST: ${{ vars.MEM0_DASHBOARD_HOST }}
          # Optional explicit URL overrides (default: https://<host>).
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          NEXT_PUBLIC_INSTANCE_NAME: ${{ vars.NEXT_PUBLIC_INSTANCE_NAME }}
        run: |
          umask 077
          cat > .env <<EOF
          # ---- generated by deploy workflow; do not commit ----
          OPENAI_API_KEY=${OPENAI_API_KEY}
          GOOGLE_API_KEY=${GOOGLE_API_KEY}

          # Provider selection (defaults to gemini for this deployment).
          MEM0_LLM_PROVIDER=${MEM0_LLM_PROVIDER:-gemini}
          MEM0_EMBEDDER_PROVIDER=${MEM0_EMBEDDER_PROVIDER:-gemini}

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=postgres
          POSTGRES_USER=${POSTGRES_USER:-postgres}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_COLLECTION_NAME=memories
          APP_DB_NAME=mem0_app

          JWT_SECRET=${JWT_SECRET}
          ADMIN_API_KEY=${ADMIN_API_KEY}
          AUTH_DISABLED=${AUTH_DISABLED:-false}

          # Traefik ingress hostnames (used by the router Host() rules).
          MEM0_SERVER_HOST=${MEM0_SERVER_HOST}
          MEM0_DASHBOARD_HOST=${MEM0_DASHBOARD_HOST}

          # Public URLs default to https://<host>; override via the vars above.
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://${MEM0_SERVER_HOST}}
          DASHBOARD_URL=${DASHBOARD_URL:-https://${MEM0_DASHBOARD_HOST}}
          NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Mem0}

          MEM0_TELEMETRY=false
          EOF

      - name: Deploy compose stack
        working-directory: server
        run: |
          docker compose -f docker-compose.prod.yaml up -d --build --remove-orphans
          docker image prune -f

      - name: Wait for API health
        working-directory: server
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yaml exec -T mem0 \
                 curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            echo "waiting for API... ($i/30)"
            sleep 5
          done
          echo "::error::API did not become healthy in time"
          docker compose -f docker-compose.prod.yaml ps
          docker compose -f docker-compose.prod.yaml logs --tail=80
          exit 1

      - name: Remove generated .env
        if: always()
        working-directory: server
        run: rm -f .env
