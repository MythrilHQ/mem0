name: Deploy Mem0 Server

# Builds and (re)deploys the self-hosted Mem0 server + dashboard stack on the
# self-hosted runner labeled `mem0`. The runner host IS the deployment target:
# it checks out the repo, materializes server/.env from repository secrets, and
# brings the docker compose stack up in place.

on:
  push:
    branches: [development]
    paths:
      - "server/**"
      - "mem0/**"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys against the same host at once; let an in-flight deploy
# finish rather than cancelling it mid-rollout.
concurrency:
  group: deploy-mem0
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy stack
    runs-on: [self-hosted, mem0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize server/.env from secrets
        working-directory: server
        env:
          # Sensitive — Repository secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # Non-sensitive — Repository variables (with sane defaults)
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          DASHBOARD_PORT: ${{ vars.DASHBOARD_PORT }}
          AUTH_DISABLED: ${{ vars.AUTH_DISABLED }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_INSTANCE_NAME: ${{ vars.NEXT_PUBLIC_INSTANCE_NAME }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          umask 077
          cat > .env <<EOF
          # ---- generated by deploy workflow; do not commit ----
          OPENAI_API_KEY=${OPENAI_API_KEY}

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=postgres
          POSTGRES_USER=${POSTGRES_USER:-postgres}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_COLLECTION_NAME=memories
          APP_DB_NAME=mem0_app

          JWT_SECRET=${JWT_SECRET}
          ADMIN_API_KEY=${ADMIN_API_KEY}
          AUTH_DISABLED=${AUTH_DISABLED:-false}

          DASHBOARD_URL=${DASHBOARD_URL}
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Mem0}

          SERVER_PORT=${SERVER_PORT:-8888}
          DASHBOARD_PORT=${DASHBOARD_PORT:-3001}

          MEM0_TELEMETRY=false
          EOF

      - name: Deploy compose stack
        working-directory: server
        run: |
          docker compose -f docker-compose.prod.yaml up -d --build --remove-orphans
          docker image prune -f

      - name: Wait for API health
        working-directory: server
        run: |
          PORT="${{ vars.SERVER_PORT || '8888' }}"
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${PORT}/api/health" >/dev/null 2>&1; then
              echo "API healthy on port ${PORT}"
              exit 0
            fi
            echo "waiting for API... ($i/30)"
            sleep 5
          done
          echo "::error::API did not become healthy in time"
          docker compose -f docker-compose.prod.yaml ps
          docker compose -f docker-compose.prod.yaml logs --tail=80
          exit 1

      - name: Remove generated .env
        if: always()
        working-directory: server
        run: rm -f .env
