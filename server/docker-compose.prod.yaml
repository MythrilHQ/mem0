# Deployable stack for the self-hosted Mem0 server + dashboard, fronted by the
# host Traefik v3 container on the shared `proxy` network. The EC2 bootstrap
# installs that standalone proxy from traefik/; the GitHub runner deploys each
# Mem0 environment independently.
#
#   docker compose -f docker-compose.prod.yaml build --no-cache --pull
#   docker compose -f docker-compose.prod.yaml up -d --no-build
#
# MULTI-ENVIRONMENT: this one file serves every environment (dev, staging, ...).
# MEM0_STACK_NAME namespaces everything so environments run side by side on the
# same host without colliding:
#   - compose project name  -> unique containers, networks, and volumes
#   - Traefik router/service names -> globally unique in Traefik
# Set MEM0_STACK_NAME per environment (e.g. `mem0` for dev, `mem0-staging` for
# staging). Defaults to `mem0`.
#
# Ingress (handled by Traefik, HTTPS via Let's Encrypt HTTP-01 by default).
# Hostnames and Traefik settings come from the environment (the deploy workflow
# passes them from GitHub environment/repo variables; locally, a .env file is
# auto-loaded by compose for interpolation):
#   - server     -> https://${MEM0_SERVER_HOST}
#   - dashboard  -> https://${MEM0_DASHBOARD_HOST}
# Traefik overrides (defaults in parentheses):
#   TRAEFIK_ENTRYPOINT (websecure), TRAEFIK_CERTRESOLVER (letsencrypt),
#   TRAEFIK_MIDDLEWARES (security-headers@file). The default middleware is
#   tracked in traefik/dynamic/security.yml; set TRAEFIK_MIDDLEWARES to "" to
#   disable it.
#
# Network topology (all networks except `proxy` are per-project, so staging and
# dev are fully isolated):
#   - proxy         (external)        -> Traefik <-> server/dashboard ingress.
#   - mem0_backend  (internal: true)  -> postgres <-> server ONLY. No gateway,
#                                        so the DB is unreachable from outside
#                                        the project and is NOT published to host.
#   - mem0_frontend (bridge)          -> server <-> dashboard internal API calls,
#                                        plus the server's outbound route to the LLM API.
#
# No service publishes a host port: all external access goes through Traefik.
# Postgres has no `ports:` entry and sits on an internal-only network.
name: ${MEM0_STACK_NAME:-mem0}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: "128mb"
    networks:
      - mem0_backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    # NOTE: intentionally no `ports:` — postgres is private to mem0_backend.

  mem0:
    build:
      context: ..
      dockerfile: server/prod.Dockerfile
      labels:
        - "ai.mem0.deployment.project=${MEM0_STACK_NAME:-mem0}"
        - "ai.mem0.deployment.service=mem0"
    restart: unless-stopped
    # No env_file: values are interpolated from the process environment (the
    # deploy workflow's job env) or a local .env auto-loaded by compose. This
    # keeps the CI runner from writing any secret file to disk.
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MEM0_LLM_PROVIDER=${MEM0_LLM_PROVIDER:-gemini}
      - MEM0_EMBEDDER_PROVIDER=${MEM0_EMBEDDER_PROVIDER:-gemini}
      - MEM0_DEFAULT_LLM_MODEL=${MEM0_DEFAULT_LLM_MODEL:-}
      - MEM0_DEFAULT_EMBEDDER_MODEL=${MEM0_DEFAULT_EMBEDDER_MODEL:-}
      - MEM0_EMBEDDING_DIMS=${MEM0_EMBEDDING_DIMS:-}
      # In-cluster DB host is fixed regardless of any external override.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_COLLECTION_NAME=${POSTGRES_COLLECTION_NAME:-memories}
      - APP_DB_NAME=${APP_DB_NAME:-mem0_app}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      - DASHBOARD_URL=${DASHBOARD_URL:-}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-false}
      - PYTHONUNBUFFERED=1
    networks:
      mem0_backend: {}
      # Project-scoped alias for dashboard->server internal calls. The default
      # service alias `mem0` also lands on the shared `proxy` network, where it
      # would be ambiguous across stacks; `mem0-internal` lives only on this
      # project's mem0_frontend, so it always resolves to THIS stack's server.
      mem0_frontend:
        aliases:
          - mem0-internal
      proxy: {}
    volumes:
      - mem0_history:/app/history
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/auth/setup-status"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      # Reach this container over the proxy network (it's on three networks).
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-server.rule=Host(`${MEM0_SERVER_HOST:?set MEM0_SERVER_HOST}`)"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-server.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-server.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-server.middlewares=${TRAEFIK_MIDDLEWARES:-security-headers@file}"
      - "traefik.http.services.${MEM0_STACK_NAME:-mem0}-server.loadbalancer.server.port=8000"

  mem0-dashboard:
    build:
      context: ./dashboard
      labels:
        - "ai.mem0.deployment.project=${MEM0_STACK_NAME:-mem0}"
        - "ai.mem0.deployment.service=mem0-dashboard"
    restart: unless-stopped
    networks:
      - mem0_frontend
      - proxy
    environment:
      # Browser-facing URL of the server (cross-origin calls from the dashboard
      # in the user's browser). Must be the public server domain over HTTPS.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      # Server-side (container-to-container) calls use the project-scoped alias
      # so staging never talks to dev's server (see the mem0 service aliases).
      - API_INTERNAL_URL=http://mem0-internal:8000
      - NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Mem0}
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-dashboard.rule=Host(`${MEM0_DASHBOARD_HOST:?set MEM0_DASHBOARD_HOST}`)"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-dashboard.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-dashboard.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${MEM0_STACK_NAME:-mem0}-dashboard.middlewares=${TRAEFIK_MIDDLEWARES:-security-headers@file}"
      - "traefik.http.services.${MEM0_STACK_NAME:-mem0}-dashboard.loadbalancer.server.port=3000"

volumes:
  postgres_db:
  mem0_history:

networks:
  # Created by the standalone traefik/compose.yaml host project.
  proxy:
    external: true
  mem0_backend:
    driver: bridge
    internal: true
  mem0_frontend:
    driver: bridge
