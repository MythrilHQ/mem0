# Production stack for the self-hosted Mem0 server + dashboard, fronted by an
# existing Traefik v3 instance (TLS + routing) on the shared `proxy` network.
#
#   docker compose -f docker-compose.prod.yaml up -d --build
#
# Ingress (handled by Traefik, HTTPS via Cloudflare cert resolver). Hostnames
# come from variables — set them in server/.env (the deploy workflow populates
# them from GitHub repository variables):
#   - server     -> https://${MEM0_SERVER_HOST}
#   - dashboard  -> https://${MEM0_DASHBOARD_HOST}
#
# Network topology:
#   - proxy         (external)        -> Traefik <-> server/dashboard ingress.
#   - mem0_backend  (internal: true)  -> postgres <-> server ONLY. No gateway,
#                                        so the DB is unreachable from outside
#                                        the project and is NOT published to host.
#   - mem0_frontend (bridge)          -> server <-> dashboard internal API calls,
#                                        plus the server's outbound route to the LLM API.
#
# No service publishes a host port: all external access goes through Traefik.
# Postgres has no `ports:` entry and sits on an internal-only network.
name: mem0

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: "128mb"
    networks:
      - mem0_backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    # NOTE: intentionally no `ports:` — postgres is private to mem0_backend.

  mem0:
    build:
      context: ..
      dockerfile: server/prod.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Force the in-cluster DB host regardless of what .env says.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PYTHONUNBUFFERED=1
    networks:
      - mem0_backend
      - mem0_frontend
      - proxy
    volumes:
      - mem0_history:/app/history
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      # Reach this container over the proxy network (it's on three networks).
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.mem0-server.rule=Host(`${MEM0_SERVER_HOST:?set MEM0_SERVER_HOST in server/.env}`)"
      - "traefik.http.routers.mem0-server.entrypoints=websecure"
      - "traefik.http.routers.mem0-server.tls.certresolver=cloudflare"
      - "traefik.http.routers.mem0-server.middlewares=security-headers@file"
      - "traefik.http.services.mem0-server.loadbalancer.server.port=8000"

  mem0-dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    networks:
      - mem0_frontend
      - proxy
    environment:
      # Browser-facing URL of the server (cross-origin calls from the dashboard
      # in the user's browser). Must be the public server domain over HTTPS.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      # Server-side (container-to-container) calls stay on the docker network.
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Mem0}
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.mem0-dashboard.rule=Host(`${MEM0_DASHBOARD_HOST:?set MEM0_DASHBOARD_HOST in server/.env}`)"
      - "traefik.http.routers.mem0-dashboard.entrypoints=websecure"
      - "traefik.http.routers.mem0-dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.mem0-dashboard.middlewares=security-headers@file"
      - "traefik.http.services.mem0-dashboard.loadbalancer.server.port=3000"

volumes:
  postgres_db:
  mem0_history:

networks:
  # Pre-existing Traefik network (`docker network create proxy`).
  proxy:
    external: true
  mem0_backend:
    driver: bridge
    internal: true
  mem0_frontend:
    driver: bridge
